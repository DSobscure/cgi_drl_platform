default_torch:
    observation_preprocessor: [cgi_drl.environment.pommerman.config.observation_preprocessor_template, DefaultTemplate, environment/pommerman/config/observation_preprocessor.yaml, stack4]
    qr_dqn: [cgi_drl.decision_model.qr_dqn.config.pommerman.model_template_torch, DefaultTemplate, decision_model/qr_dqn/config/pommerman/model_torch.yaml, default_torch]
    experience_replay: [cgi_drl.default_config, Default, data_storage/experience_replay/config/atari.yaml, atari_prioritized]
    
    version: versions/pommerman_apex_qr_rainbow_torch
    batch_size: 128
    is_load_policy: false
    training_steps: 100000000
    update_step_frequent: 32
    update_target_step_frequent: 25600
    epoch_steps: 1000000000
    max_game_step: 10000 
    discount_factor_gammas: [0.99]
    n_step_size: 5

    evaluation_max_game_step: 10000
    evaluation_episode_count: 16

    evaluation_action_epsilon: 0.001
    minimal_replay_memory_size: 10000