    ppo: [cgi_drl.decision_model.ppo.config.pommerman.model_template, TorchTemplate, decision_model/ppo/config/pommerman/model.yaml, default_torch]
    demonstration_memory: [cgi_drl.default_config, Default, data_storage/demonstration_memory/config/pommerman.yaml, one_vs_one_generation]
    
    version: versions/pommerman_ppo_generator_torch
    is_load_policy: true
    load_policy_model_path: versions/pommerman_ppo_baseline_torch_0219_simple/agent_pool/PPO_Baseline_99/model_latest.ckpt
    training_steps: 100000000
    max_game_step: 10000 
    evaluation_max_game_step: 10000
    demonstration_file_name: PPO_Baseline_demonstrations.pkl.gz

