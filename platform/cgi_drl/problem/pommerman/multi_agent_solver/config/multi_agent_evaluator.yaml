test:
    evaluation_environment: [cgi_drl.environment.pommerman.config.environment_template, DefaultTemplate, environment/pommerman/config/environment.yaml, pommerman_1v1-eval]
    agent_pool_manager: [cgi_drl.multi_agent_system.agent_pool.config.pommerman, DefaultTemplate, multi_agent_system/agent_pool/config/pommerman.yaml, default]
    agent_mapping:
        train:
            - # Stage 0
                # Subphase
                # Subphase
                - Player1: PPO_Baseline
                  Player2: PPO_Baseline2
        eval:
            - # Stage 0
                # Subphase
                - Player1: PPO_Baseline
                  Player2: PPO_Baseline2

    single_solvers:
        PPO_Baseline:
            solver: [cgi_drl.problem.pommerman.ppo_solver.static_solver_torch, PommermanPpoSolver]
            config: [cgi_drl.problem.pommerman.ppo_solver.config.solver_template, SelfplayTemplate, problem/pommerman/ppo_solver/config/solver.yaml, pretrain_torch]
        PPO_Baseline2:
            solver: [cgi_drl.problem.pommerman.ppo_solver.static_solver_torch, PommermanPpoSolver]
            config: [cgi_drl.problem.pommerman.ppo_solver.config.solver_template, SelfplayTemplate, problem/pommerman/ppo_solver/config/solver.yaml, pretrain_torch]

    multi_agent_solver:
        agent_sampling_scheme:
            eval: uniform
        subphase_episode_count:
            eval: 50
        change_agent_episode_count:
            eval: 200
    version: versions/pommerman_simple_agent_eval_test

