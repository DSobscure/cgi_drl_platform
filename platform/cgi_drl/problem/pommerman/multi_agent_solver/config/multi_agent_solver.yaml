ppo_baseline_torch:
    environment: [cgi_drl.environment.pommerman.config.environment_template, DefaultTemplate, environment/pommerman/config/environment.yaml, pommerman_1v1_32]
    evaluation_environment: [cgi_drl.environment.pommerman.config.environment_template, DefaultTemplate, environment/pommerman/config/environment.yaml, pommerman_1v1_32-eval]
    agent_pool_manager: [cgi_drl.multi_agent_system.agent_pool.config.pommerman, DefaultTemplate, multi_agent_system/agent_pool/config/pommerman.yaml, default]
    agent_mapping:
        train:
            - # Stage 0
                - Player1: PPO_Baseline
                  Player2: MixAgent1
            - # Stage 1
                - Player1: PPO_Baseline
                  Player2: MixAgent2
            - # Stage 2
                - Player1: PPO_Baseline
                  Player2: MixAgent3
            - # Stage 3
                - Player1: PPO_Baseline
                  Player2: MixAgent4

        eval:
            - # Stage 0
                - Player1: PPO_Baseline
                  Player2: CampAgent
                - Player1: PPO_Baseline
                  Player2: RoamAgent
                - Player1: PPO_Baseline
                  Player2: SimpleAgent_NoBomb
                - Player1: PPO_Baseline
                  Player2: SimpleAgent
            - # Stage 1
                - Player1: PPO_Baseline
                  Player2: CampAgent
                - Player1: PPO_Baseline
                  Player2: RoamAgent
                - Player1: PPO_Baseline
                  Player2: SimpleAgent_NoBomb
                - Player1: PPO_Baseline
                  Player2: SimpleAgent
            - # Stage 2
                - Player1: PPO_Baseline
                  Player2: CampAgent
                - Player1: PPO_Baseline
                  Player2: RoamAgent
                - Player1: PPO_Baseline
                  Player2: SimpleAgent_NoBomb
                - Player1: PPO_Baseline
                  Player2: SimpleAgent
            - # Stage 3
                - Player1: PPO_Baseline
                  Player2: CampAgent
                - Player1: PPO_Baseline
                  Player2: RoamAgent
                - Player1: PPO_Baseline
                  Player2: SimpleAgent_NoBomb
                - Player1: PPO_Baseline
                  Player2: SimpleAgent

    single_solvers:
        PPO_Baseline:
            solver: [cgi_drl.problem.pommerman.ppo_solver.trainer_torch, PommermanPpoSolver]
            static_solver: [cgi_drl.problem.pommerman.ppo_solver.static_solver_torch, PommermanPpoSolver]
            config: [cgi_drl.problem.pommerman.ppo_solver.config.solver_template, DefaultTemplate, problem/pommerman/ppo_solver/config/solver.yaml, default_torch]
            anchor: PPO_Baseline
        CampAgent:
            solver: [cgi_drl.problem.pommerman.roam_solver.solver, RoamSolver]
            config: [cgi_drl.default_config, Default, problem/pommerman/roam_solver/config/solver.yaml, camp_default]
        RoamAgent:
            solver: [cgi_drl.problem.pommerman.roam_solver.solver, RoamSolver]
            config: [cgi_drl.default_config, Default, problem/pommerman/roam_solver/config/solver.yaml, roam_default]
        SimpleAgent_NoBomb:
            solver: [cgi_drl.problem.pommerman.simple_solver.simple_solver, SimpleSolver]
            config: [cgi_drl.default_config, Default, problem/pommerman/simple_solver/config/solver.yaml, no_bomb]
        SimpleAgent:
            solver: [cgi_drl.problem.pommerman.simple_solver.simple_solver, SimpleSolver]
            config: [cgi_drl.default_config, Default, problem/pommerman/simple_solver/config/solver.yaml, default]
        MixAgent1:
            solver: [cgi_drl.problem.pommerman.simple_solver.simple_solver, SimpleSolver]
            config: [cgi_drl.default_config, Default, problem/pommerman/simple_solver/config/solver.yaml, mix1]
        MixAgent2:
            solver: [cgi_drl.problem.pommerman.simple_solver.simple_solver, SimpleSolver]
            config: [cgi_drl.default_config, Default, problem/pommerman/simple_solver/config/solver.yaml, mix2]
        MixAgent3:
            solver: [cgi_drl.problem.pommerman.simple_solver.simple_solver, SimpleSolver]
            config: [cgi_drl.default_config, Default, problem/pommerman/simple_solver/config/solver.yaml, mix3]
        MixAgent4:
            solver: [cgi_drl.problem.pommerman.simple_solver.simple_solver, SimpleSolver]
            config: [cgi_drl.default_config, Default, problem/pommerman/simple_solver/config/solver.yaml, mix4]

    multi_agent_solver:
        training_iteration_count: 200
        agent_sampling_scheme:
            train: uniform
            eval: uniform
        subphase_step_period:
            train: 512000 # each agent run half steps
            eval: 51200
        change_agent_step_period:
            train: 512000
            eval: 51200
        start_stage: 0
        start_iteration: 0
    version: versions/pommerman_ppo_baseline_torch

