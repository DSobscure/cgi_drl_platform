        SimpleAgent_NoBomb:
            solver: [cgi_drl.problem.pommerman.simple_solver.simple_solver, SimpleSolver]
            config: [cgi_drl.default_config, Default, problem/pommerman/simple_solver/config/solver.yaml, no_bomb]
        SimpleAgent:
            solver: [cgi_drl.problem.pommerman.simple_solver.simple_solver, SimpleSolver]
            config: [cgi_drl.default_config, Default, problem/pommerman/simple_solver/config/solver.yaml, default]
        MixAgent4:
            solver: [cgi_drl.problem.pommerman.simple_solver.simple_solver, SimpleSolver]
            config: [cgi_drl.default_config, Default, problem/pommerman/simple_solver/config/solver.yaml, mix4]

    multi_agent_solver:
        training_iteration_count: 500
        agent_sampling_scheme:
            train: uniform
            eval: uniform
        subphase_step_period:
            train: 64000 # each agent run half steps
            eval: 51200
        change_agent_step_period:
            train: 64000
            eval: 51200
        start_stage: 0
        start_iteration: 0
