default:
    print_message: true
    # For agent pool, will keep n recent snapshots (like a sliding window)
    # The capacity is independent of different type of agent (i.e. alice: n, bob: n)
    pool_capacity: 16

    # For Elo rating
    default_elo_rating: 1000
    k_factor: 16
    use_score_rating: false

selfplay:
    print_message: true
    # For agent pool, will keep n recent snapshots (like a sliding window)
    # The capacity is independent of different type of agent (i.e. alice: n, bob: n)
    pool_capacity: 16

    # For Elo rating
    default_elo_rating: 1000
    k_factor: 16
    use_score_rating: false
    fixed_agent_list:
        - "MixAgent4"
